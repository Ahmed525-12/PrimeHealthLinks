<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#006b3f">
    <title>Prime Health | Links</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --green:#006b3f; --deep-green:#004b2c; --bright-green:#00843d; --gold:#d4aa00; --soft-gold:#f7efc8; --paper:#fffdf6; }
        * { box-sizing:border-box; }
        body { margin:0; min-height:100vh; overflow-x:hidden; color:var(--paper); font-family:"DM Sans",ui-sans-serif,system-ui,sans-serif; background:radial-gradient(circle at 50% 0%,#07814a 0%,var(--green) 38%,var(--deep-green) 100%); }
        .page { width:min(100% - 32px,480px); margin:0 auto; padding:42px 0 34px; }
        .profile { margin-bottom:34px; text-align:center; animation:fade-in 650ms ease-out both; }
        .profile-image { width:156px; height:156px; object-fit:contain; margin-bottom:16px; border:1px solid rgba(255,255,255,.6); border-radius:32px; box-shadow:0 16px 36px rgba(0,47,28,.32); background:#fff; }
        h1 { margin:0; color:var(--paper); font-size:clamp(1.45rem,4vw,1.9rem); font-weight:700; letter-spacing:-.035em; }
        .tagline { margin:8px 0 0; color:#fff; font-size:.76rem; font-weight:600; letter-spacing:.04em; }
        .links { display:grid; gap:14px; }
        .link-item { display:flex; align-items:center; min-height:76px; padding:14px 16px; border:2px solid transparent; border-radius:18px; color:var(--deep-green); background:var(--paper); box-shadow:0 8px 22px rgba(0,47,28,.17); text-decoration:none; transition:transform 180ms ease,background 180ms ease,border-color 180ms ease,box-shadow 180ms ease; animation:rise-in 550ms ease-out both; }
        .link-item:hover,.link-item:focus-visible { color:var(--deep-green); background:var(--soft-gold); border-color:var(--gold); box-shadow:0 12px 28px rgba(0,47,28,.26); transform:translateY(-3px); }
        .link-item:focus-visible { outline:3px solid rgba(247,239,200,.9); outline-offset:3px; }
        .link-icon { display:grid; width:48px; height:48px; flex:0 0 48px; place-items:center; margin-right:14px; overflow:hidden; border-radius:14px; background:linear-gradient(145deg,var(--bright-green),var(--deep-green)); box-shadow:0 4px 10px rgba(0,47,28,.2); }
        .link-icon img { width:70%; height:70%; object-fit:contain; }
        .link-item:first-child .link-icon img { width:100%; height:100%; background:#fff; }
        .link-text { font-size:1rem; font-weight:700; letter-spacing:-.01em; }
        .footer { margin-top:30px; color:#fff; font-size:.76rem; text-align:center; }
        @keyframes fade-in { from{opacity:0;transform:translateY(-12px)} to{opacity:1;transform:translateY(0)} }
        @keyframes rise-in { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
        .link-item:nth-child(2) { animation-delay:80ms; } .link-item:nth-child(3) { animation-delay:160ms; }
        @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; transition-duration:.01ms!important; } }
    </style>
</head>
<body>
    <main class="page">
        <header class="profile">
            <img src="logo.png" alt="Prime Health" class="profile-image">
            <h1>Prime Health</h1>
            <p class="tagline">The science of nutritional health</p>
        </header>
        <nav class="links" aria-label="Prime Health links">
            <a class="link-item" href="https://primehealth.sa.com/" target="_blank" rel="noopener noreferrer"><span class="link-icon"><img src="logo.png" alt=""></span><span class="link-text">Prime Health Store</span></a>
            <a class="link-item" href="https://www.instagram.com/primehealth_sa" target="_blank" rel="noopener noreferrer"><span class="link-icon"><img src="ig.jpg" alt=""></span><span class="link-text">Instagram</span></a>
            <a class="link-item" href="https://www.tiktok.com/@primehealth84" target="_blank" rel="noopener noreferrer"><span class="link-icon"><img src="TikTok.svg" alt=""></span><span class="link-text">TikTok</span></a>
        </nav>
        <footer class="footer">Prime Health · Nutritional health, made simple</footer>
    </main>
</body>
</html>
